name: Windows

on:
  push:
    paths:
      - "windows/**"
      - "!windows/**/*.md"
      - "Resources/AppIcon.png"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
      - "!windows/**/*.md"
      - "Resources/AppIcon.png"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json
      - name: Test
        working-directory: windows
        run: dotnet test tests/ScreenPlus.Core.Tests -c Release
      - name: Build the Windows app (cross-compile check)
        working-directory: windows
        run: dotnet build src/ScreenPlus -c Release

  windows:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      - name: Describe the machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          "Media Foundation (mfplat.dll): $(Test-Path $env:WINDIR\System32\mfplat.dll)"
          "H.264 encoder (msmpeg2enc.dll): $(Test-Path $env:WINDIR\System32\msmpeg2enc.dll)"
          # The UI and screen-capture tests need an interactive desktop, which hosted runners have.
          "Session: $([System.Diagnostics.Process]::GetCurrentProcess().SessionId), interactive: $([Environment]::UserInteractive)"

      - name: Build
        working-directory: windows
        run: dotnet build ScreenPlus.Windows.slnx -c Release

      - name: Core tests
        working-directory: windows
        run: dotnet test tests/ScreenPlus.Core.Tests -c Release --no-build
        env:
          SCREENPLUS_TEST_OUTPUT: ${{ github.workspace }}/test-output

      - name: Windows integration tests
        working-directory: windows
        run: dotnet test tests/ScreenPlus.Windows.Tests -c Release --no-build --logger "console;verbosity=detailed"
        env:
          SCREENPLUS_TEST_OUTPUT: ${{ github.workspace }}/test-output

      - name: Publish
        working-directory: windows
        run: >
          dotnet publish src/ScreenPlus -c Release -r ${{ matrix.rid }} --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o ${{ github.workspace }}/dist

      - name: Smoke-test the published app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/ScreenPlus.exe -ArgumentList '--help' -Wait -PassThru -NoNewWindow -RedirectStandardOutput help.txt
          Get-Content help.txt
          if ($p.ExitCode -ne 0) { throw "ScreenPlus --help exited with $($p.ExitCode)" }

          # Render one of the integration tests' recordings with the shipped exe.
          $events = Get-ChildItem $env:TEMP -Directory -Filter 'screenplus-test-*' |
            ForEach-Object { Join-Path $_.FullName 'events.json' } | Where-Object { Test-Path $_ } | Select-Object -First 1
          $p = Start-Process -FilePath dist/ScreenPlus.exe -ArgumentList '--render', "`"$events`"", 'smoke.mp4' -Wait -PassThru -NoNewWindow -RedirectStandardOutput render.txt
          Get-Content render.txt
          if ($p.ExitCode -ne 0 -or -not (Test-Path smoke.mp4)) { throw "ScreenPlus --render exited with $($p.ExitCode)" }
          "smoke.mp4: $((Get-Item smoke.mp4).Length) bytes"

      - name: Build the installer
        shell: pwsh
        working-directory: windows
        run: |
          # The installer ships the app as a folder, which starts faster than the self-extracting single exe.
          dotnet publish src/ScreenPlus -c Release -r ${{ matrix.rid }} --self-contained -o dist/app-${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          $arch = '${{ matrix.rid }}' -replace '^win-', ''
          & $iscc "/DAppVersion=$version" "/DArch=$arch" "/DSourceDir=$(Resolve-Path dist/app-${{ matrix.rid }})" installer/ScreenPlus.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item "dist/ScreenPlus-Setup-$version-$arch.exe" ${{ github.workspace }}/dist/

      - name: Test the installer (install, run, uninstall)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist/ScreenPlus-Setup-*.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/TASKS=desktopicon', '/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; throw "setup exited with $($p.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\ScreenPlus\ScreenPlus.exe"
          if (-not (Test-Path $app)) { Get-Content install.log; throw "ScreenPlus.exe wasn't installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\ScreenPlus.lnk")) { throw "no Start menu shortcut" }
          if (-not (Test-Path "$([Environment]::GetFolderPath('Desktop'))\ScreenPlus.lnk")) { throw "no desktop shortcut" }
          $p = Start-Process $app -ArgumentList '--help' -Wait -PassThru -NoNewWindow -RedirectStandardOutput help.txt
          Get-Content help.txt
          if ($p.ExitCode -ne 0) { throw "installed ScreenPlus exited with $($p.ExitCode)" }
          $uninstaller = "$env:LOCALAPPDATA\Programs\ScreenPlus\unins000.exe"
          $p = Start-Process $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          # The uninstaller hands off to a copy of itself; give it a moment to finish.
          for ($i = 0; $i -lt 30 -and (Test-Path $app); $i++) { Start-Sleep 1 }
          if (Test-Path $app) { throw "uninstall left ScreenPlus.exe behind" }
          "installed, ran and uninstalled $(Split-Path $setup -Leaf) ($([math]::Round((Get-Item $setup).Length / 1MB)) MB)"

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenPlus-Setup-${{ matrix.rid }}
          path: dist/ScreenPlus-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenPlus-${{ matrix.rid }}
          path: dist/ScreenPlus.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output-${{ matrix.rid }}
          path: test-output
          if-no-files-found: ignore
